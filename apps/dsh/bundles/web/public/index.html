<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Harness</title>

  <!--
    Bootstrap do shell React — tem de correr ANTES de qualquer activo carregar.

    Ordem, e a razão de cada passo:

      1. cookie do token — style.css, o manifesto e os módulos ES exigem
         autenticação, e um <link>/<script> não deixa definir headers: só o
         cookie, que é aqui que se grava.
      2. <link> do CSS criado AQUI e não no HTML — o preload scanner do
         browser descobre os activos do documento e dispara o pedido antes do
         script correr; sem o cookie pronto, o CSS voltava como 401 (JSON) e
         o browser recusava-o por MIME errado.
      3. /__dsh_boot__.js — script clássico que grava `window.__DSH_BOOT__`,
         incluindo a tabela de módulos de plataforma (React + workspace).
      4. import map — construído a partir dessa tabela e injectado ANTES de
         qualquer módulo ES: a UI não tem bundler, resolve tudo por URLs
         servidas pelo host. É a ÚNICA fonte destas entradas — nada disto
         está escrito à mão neste ficheiro.
      5. React UMD — o React 18 só distribui CJS/UMD, por isso os UMD entram
         por tags clássicas (`window.React`/`window.ReactDOM`) e os shims ESM
         de /platform/ expõem-nos como módulos. react antes de react-dom.
      6. import do shell — só aqui, com cookie, mapa e React prontos.

    Se não houver token, nada disto acontece e fica só o aviso essencial.
  -->
  <script>
    (function () {
      function showError(msg) {
        function show() {
          var box = document.getElementById('boot-error')
          if (!box) return
          box.hidden = false
          if (msg) box.querySelector('p').textContent = msg
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show)
        else show()
      }
      window.__DSH_SHOW_ERROR__ = showError

      var params = new URLSearchParams(location.search)
      var fromUrl = params.get('access_token')
      var token = fromUrl || sessionStorage.getItem('dsh_token') || ''
      if (fromUrl) {
        // Guarda e tira da barra de endereço: não fica no histórico.
        sessionStorage.setItem('dsh_token', fromUrl)
        params.delete('access_token')
        var rest = params.toString()
        history.replaceState(null, '', location.pathname + (rest ? '?' + rest : ''))
      }
      if (!token) token = window.prompt('Token de acesso do host (a linha "token …" do dsh web):') || ''
      window.__DSH_TOKEN__ = token

      if (!token) {
        showError('Sem token de acesso. Reabra a UI pela URL que o dsh web imprimiu, com ?access_token=…')
        return
      }

      document.cookie = 'access_token=' + encodeURIComponent(token) + '; Path=/; SameSite=Strict'

      // O <link> nasce AQUI e não no HTML: o preload scanner do browser
      // descobre os activos do documento e dispara o pedido antes do script
      // correr — sem o cookie pronto, o CSS voltava como 401 (JSON) e o
      // browser recusava-o por MIME errado, deixando a página por estilizar.
      var css = document.createElement('link')
      css.rel = 'stylesheet'
      css.href = '/style.css'
      document.head.appendChild(css)

      /** Carrega um script clássico e só resolve quando ele executou. */
      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var tag = document.createElement('script')
          tag.src = src
          tag.onload = function () { resolve() }
          tag.onerror = function () { reject(new Error('falha ao carregar ' + src)) }
          document.head.appendChild(tag)
        })
      }

      loadScript('/__dsh_boot__.js')
        .then(function () {
          var boot = window.__DSH_BOOT__
          if (!boot || boot.version !== 1) throw new Error('manifesto de boot inválido')

          // O import map é um só por documento e tem de nascer antes do
          // primeiro módulo ES — por isso se injecta aqui, a partir da tabela
          // do host, em vez de deixar o loader (que só corre dentro do shell)
          // tentar repô-lo.
          var table = boot.platform && Object.keys(boot.platform).length ? boot.platform : null
          if (!table) throw new Error('tabela de módulos de plataforma vazia no boot')
          var map = document.createElement('script')
          map.type = 'importmap'
          map.textContent = JSON.stringify({ imports: table })
          document.head.appendChild(map)

          // react tem de existir antes do react-dom: o UMD do react-dom lê
          // `window.React` no momento da avaliação.
          return loadScript('/platform/react.umd.js')
            .then(function () { return loadScript('/platform/react-dom.umd.js') })
        })
        .then(function () { return import('/client/dsh-web-frontend/main.js') })
        .catch(function (failure) {
          showError('Falha ao carregar a interface: ' + (failure && failure.message ? failure.message : failure))
        })
    })()
  </script>
</head>
<body>
  <div id="boot-error" class="boot-error" hidden>
    <div>
      <h1>Sem acesso</h1>
      <p></p>
    </div>
  </div>

  <!-- Ponto de monta do shell React. Vazio até o módulo principal renderizar. -->
  <div id="root"></div>
</body>
</html>
