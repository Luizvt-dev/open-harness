# ---------------------------------------------------------------------------
# Bundle `web` — perfil com superfície web: agente + tools + servidor local.
#
# Materializado pela CLI `dsh web` (`<home>/profiles/web/package.json` →
# `dsh.profile.bundles[0].path`). Mesma estrutura do `headless`, com mais uma
# linha: o `webserver`, que sobe o host HTTP/WebSocket em `127.0.0.1:3080`.
#
# O `requireDir` de cada linha é o directório deste ficheiro, por isso os
# especificadores bare (`@open-harness/…`) resolvem subindo até ao
# `node_modules` da app, e os caminhos relativos resolvem para `apps/dsh/dist`.
# ---------------------------------------------------------------------------

# Plugin cordis que publica o serviço `agent` (criação *lazily*: a API key só
# é validada quando alguém primeiro usa o agente).
#
# `model` aceita `provedor/modelo` (ex.: `openai/gpt-5.4`) ou só o id — nesse
# caso usa-se o provedor default (`deepseek`). Ver `dsh models` para a lista.
agent:
  plugin: '@open-harness/dsh-agent'
  config:
    model: deepseek-flash
    system: |
      You are dsh, a coding agent operating directly on the user's working
      directory. The user is watching you work in a browser: they see your
      text as it streams and each tool you call. Use the available tools to
      inspect and change files before answering. Reply in the user's language,
      be concise, and never invent file contents you have not read.

# Tools da CLI (fs, procura e shell) registadas no agente.
cli-tools:
  plugin: '../../dist/tools-plugin.js'
  requires: ['agent']

# Servidor web local: HTTP estático + gateway RPC (mux WebSocket e
# HTTP/SSE). O token, a porta e o endereço vêm do overlay que a CLI escreve a
# cada `dsh web` — aqui ficam só os valores por omissão do bundle.
webserver:
  plugin: '../../dist/web-plugin.js'
  requires: ['agent']
  config:
    port: 3080
    host: 127.0.0.1
